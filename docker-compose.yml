services:
  postgis_solar_db:
    image: postgis/postgis:16-3.4
    container_name: phoenix_solar_db
    environment:
      - POSTGRES_USER=admin_gis
      - POSTGRES_PASSWORD=solar_twin_secure
      - POSTGRES_DB=phoenix_solar_db
    ports:
      - "15432:5432"
    volumes:
      - phoenix_postgis_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    restart: unless-stopped

  solar_api:
    build: .
    container_name: phoenix_solar_api
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin_gis:solar_twin_secure@postgis_solar_db:5432/phoenix_solar_db
    depends_on:
      - postgis_solar_db
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  phoenix_postgis_data: